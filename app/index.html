<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>中国国情数据 · 国家统计</title>
<meta name="description" content="中国国家统计数据：人口、经济、就业与物价、地区数据，均注明来源与年份，离线可用。">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="masthead">
  <div class="wrap masthead-in">
    <div class="brand">
      <span class="brand-mark">统</span>
      <div>
        <h1>中国国情数据</h1>
        <p class="brand-sub">国家统计 · 人口 / 经济 / 就业 / 地区 — 数字皆有来源与年份</p>
      </div>
    </div>
    <p class="masthead-note">最新完整年度：2024 年<br>来源：国家统计局公报与年鉴</p>
  </div>
  <nav id="nav" class="wrap nav" aria-label="栏目"></nav>
</header>
<main id="view" class="wrap view"></main>
<footer class="wrap foot">
  <p>数据来源：国家统计局《2024 年国民经济和社会发展统计公报》《中国统计年鉴 2024》、第七次全国人口普查公报及各省统计公报。约数已注明口径，以官方公布原文为准。</p>
  <p>本站为静态页面，离线可用，不收集任何信息。</p>
</footer>
<script type="module" src="main.js"></script>
</body>
</html>
